<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Free AI Business Course</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23fff'/%3E%3Cpath d='M6.5 17.6c2.6 2 5 4.6 7.2 7.8C18 17 22.9 10.4 26.5 5.5' fill='none' stroke='%232140b5' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script>
    // GitHub Pages serves this page for any missing address, at any depth, so
    // point links at the site root, then load the stylesheet from there. (A
    // plain <link> would be fetched from the wrong folder before this runs.)
    (function () {
      var parts = location.pathname.split("/");
      var base = /\.github\.io$/.test(location.hostname) && parts.length > 2 ? "/" + parts[1] + "/" : "/";
      var tag = document.createElement("base");
      tag.href = base;
      document.head.appendChild(tag);
      var css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = base + "assets/css/style.css";
      document.head.appendChild(css);
    })();
  </script>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./">Free AI Business Course</a>
    </div>
  </header>

  <main class="page">
    <section class="intro" aria-labelledby="missing-title">
      <h1 id="missing-title">That page isn't here.</h1>
      <p class="lede">The link may be out of date, or the lesson may have moved. Every lesson is listed on the course map.</p>
      <div class="intro-actions">
        <a class="button" href="./">Go to the course map</a>
      </div>
    </section>
  </main>

</body>
</html>
